name: Windows installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'smartpdv/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  installers:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build independent installers
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Run transport and storage tests on Windows
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pytest -q 2>&1 | Tee-Object windows-tests.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content windows-tests.log | Select-Object -Last 45) -join '%0A'
            Write-Host "::error::$details"
            throw 'Tests failed'
          }
      - name: Test installed Windows applications
        shell: pwsh
        run: ./packaging/windows-smoke.ps1
      - name: Compute SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/installers/*-Setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 dist/installers/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SmartPDV-Windows-Installers
          path: dist/installers/*
          if-no-files-found: error
      - name: Publish test installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-test-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $notes = Join-Path $env:RUNNER_TEMP 'smartpdv-release.md'
          @'
          Dois instaladores independentes para testes em Windows 10/11 x64.
          Atualizacao 1.0.3: Agent com pressao minima de teclas de 20 ms configuravel, retorno de aceite/bloqueio do Windows e Central com F11 global, preservando cadastro e pareamento. Compatibilidade VRPDV/LS2208 precisa ser testada no caixa.
          Central: dashboard local HTTPS. Agent: captura/controle Windows reais, sem console, inicialização após login.
          Cadastre e pareie somente computadores autorizados da LAN. Configure o certificado local na Central.
          Binários sem assinatura Authenticode. Esta versão é para testes; captura e entrada física precisam de validação nos computadores de destino.
          Verifique SHA256SUMS.txt. Não é necessário Python nem internet para instalar/executar os aplicativos.
          '@ | Set-Content -Encoding utf8 $notes
          gh release create $tag dist/installers/SmartPDV-Central-Setup.exe dist/installers/SmartPDV-Agent-Setup.exe dist/installers/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "Smart PDV - instaladores Windows para testes $env:GITHUB_RUN_NUMBER" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
